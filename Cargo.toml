[package]
name = "bkk-live-tracker"
version = "2.0.0"
edition = "2021"
description = "BKK Live Tracker & DIY API – élő BKK/MÁV térkép és widget API (Rust)"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
moka = { version = "0.12", features = ["future"] }
prost = "0.13"
regex = "1"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
rust-embed = "8"
mime_guess = "2"
dotenvy = "0.15"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
